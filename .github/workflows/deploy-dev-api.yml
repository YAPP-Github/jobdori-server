name: Deploy Dev API

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Dev API
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      AWS_REGION: ap-northeast-2
      APPLICATION_NAME: jobdori-dev
      ENVIRONMENT_NAME: jobdori-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: adopt
          cache: gradle

      - name: Build deployment bundle
        run: ./gradlew :jobdori-api:elasticBeanstalkBundle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy application version
        env:
          BUNDLE_PATH: jobdori-api/build/distributions/jobdori-api-elastic-beanstalk.zip
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          deployment_bucket="jobdori-dev-deployments-${account_id}"
          version_label="dev-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          object_key="applications/${version_label}.zip"

          aws s3 cp "${BUNDLE_PATH}" "s3://${deployment_bucket}/${object_key}"

          aws elasticbeanstalk create-application-version \
            --application-name "${APPLICATION_NAME}" \
            --version-label "${version_label}" \
            --source-bundle "S3Bucket=${deployment_bucket},S3Key=${object_key}" \
            --process

          for attempt in {1..60}; do
            version_status="$(aws elasticbeanstalk describe-application-versions \
              --application-name "${APPLICATION_NAME}" \
              --version-labels "${version_label}" \
              --query 'ApplicationVersions[0].Status' \
              --output text)"

            case "${version_status}" in
              PROCESSED)
                break
                ;;
              FAILED)
                echo "Application version processing failed: ${version_label}" >&2
                exit 1
                ;;
            esac

            if [[ "${attempt}" -eq 60 ]]; then
              echo "Timed out waiting for application version processing: ${version_label}" >&2
              exit 1
            fi

            sleep 10
          done

          aws elasticbeanstalk update-environment \
            --environment-name "${ENVIRONMENT_NAME}" \
            --version-label "${version_label}"

          for attempt in {1..180}; do
            environment_status="$(aws elasticbeanstalk describe-environments \
              --environment-names "${ENVIRONMENT_NAME}" \
              --query 'Environments[0].Status' \
              --output text)"

            if [[ "${environment_status}" == "Ready" ]]; then
              break
            fi

            if [[ "${environment_status}" == "Terminated" || "${environment_status}" == "Terminating" ]]; then
              echo "Environment entered an unexpected status: ${environment_status}" >&2
              exit 1
            fi

            if [[ "${attempt}" -eq 180 ]]; then
              echo "Timed out waiting for environment update: ${ENVIRONMENT_NAME}" >&2
              aws elasticbeanstalk describe-events \
                --environment-name "${ENVIRONMENT_NAME}" \
                --max-records 20 >&2
              exit 1
            fi

            sleep 10
          done

          health="$(aws elasticbeanstalk describe-environments \
            --environment-names "${ENVIRONMENT_NAME}" \
            --query 'Environments[0].Health' \
            --output text)"

          if [[ "${health}" != "Green" ]]; then
            echo "Deployment completed with unhealthy environment status: ${health}" >&2
            exit 1
          fi

          echo "Deployed ${version_label} to ${ENVIRONMENT_NAME}"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not configured. Skipping Discord notification."
            exit 0
          fi

          case "${JOB_STATUS}" in
            success)
              title="Dev API deployment succeeded"
              color=5763719
              ;;
            cancelled)
              title="Dev API deployment cancelled"
              color=9807270
              ;;
            *)
              title="Dev API deployment failed"
              color=15548997
              ;;
          esac

          export title color

          payload="$(python3 - <<'PY'
          import json
          import os

          payload = {
              "embeds": [
                  {
                      "title": os.environ["title"],
                      "url": os.environ["RUN_URL"],
                      "color": int(os.environ["color"]),
                      "fields": [
                          {"name": "Environment", "value": "dev", "inline": True},
                          {"name": "Status", "value": os.environ["JOB_STATUS"], "inline": True},
                          {"name": "Branch", "value": os.environ["GITHUB_REF_NAME"], "inline": True},
                          {"name": "Actor", "value": os.environ["GITHUB_ACTOR"], "inline": True},
                          {"name": "Run", "value": f"[#{os.environ['GITHUB_RUN_NUMBER']}]({os.environ['RUN_URL']})", "inline": True},
                      ],
                  }
              ]
          }
          print(json.dumps(payload))
          PY
          )"

          curl \
            --fail \
            --silent \
            --show-error \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            "${DISCORD_WEBHOOK_URL}" \
            || echo "::warning::Failed to send Discord deployment notification."
