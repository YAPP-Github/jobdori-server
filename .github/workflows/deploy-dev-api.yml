name: Deploy Dev API

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Dev API
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      AWS_REGION: ap-northeast-2
      APPLICATION_NAME: jobdori-dev
      ENVIRONMENT_NAME: jobdori-dev
      DD_API_KEY_SECRET_ID: dev
      DD_SITE: us5.datadoghq.com
      DD_ENV: dev
      DD_SERVICE: jobdori-api
      DD_LLMOBS_ENABLED: "true"
      DD_LLMOBS_ML_APP: scoop
      # 호스트 Agent가 없다. LLM Obs만 앱이 직접 전송하고, Agent가 필요한 기능은 모두 끈다.
      # 로그는 EB > CloudWatch Logs > Datadog Forwarder, 인프라 지표는 Datadog AWS Integration이 담당한다.
      DD_LLMOBS_AGENTLESS_ENABLED: "true"
      DD_TRACE_ENABLED: "false"
      DD_RUNTIME_METRICS_ENABLED: "false"
      DD_LOGS_INJECTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: adopt
          cache: gradle

      - name: Build deployment bundle
        run: ./gradlew :jobdori-api:elasticBeanstalkBundle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy application version
        env:
          BUNDLE_PATH: jobdori-api/build/distributions/jobdori-api-elastic-beanstalk.zip
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          deployment_bucket="jobdori-dev-deployments-${account_id}"
          version_label="dev-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          object_key="applications/${version_label}.zip"

          aws s3 cp "${BUNDLE_PATH}" "s3://${deployment_bucket}/${object_key}"

          aws elasticbeanstalk create-application-version \
            --application-name "${APPLICATION_NAME}" \
            --version-label "${version_label}" \
            --source-bundle "S3Bucket=${deployment_bucket},S3Key=${object_key}" \
            --process

          for attempt in {1..60}; do
            version_status="$(aws elasticbeanstalk describe-application-versions \
              --application-name "${APPLICATION_NAME}" \
              --version-labels "${version_label}" \
              --query 'ApplicationVersions[0].Status' \
              --output text)"

            case "${version_status}" in
              PROCESSED)
                break
                ;;
              FAILED)
                echo "Application version processing failed: ${version_label}" >&2
                exit 1
                ;;
            esac

            if [[ "${attempt}" -eq 60 ]]; then
              echo "Timed out waiting for application version processing: ${version_label}" >&2
              exit 1
            fi

            sleep 10
          done

          aws elasticbeanstalk update-environment \
            --environment-name "${ENVIRONMENT_NAME}" \
            --version-label "${version_label}" \
            --option-settings \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DD_API_KEY_SECRET_ID,Value=${DD_API_KEY_SECRET_ID}" \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=AWS_REGION,Value=${AWS_REGION}" \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DD_SITE,Value=${DD_SITE}" \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DD_ENV,Value=${DD_ENV}" \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DD_SERVICE,Value=${DD_SERVICE}" \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DD_VERSION,Value=${version_label}" \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DD_TRACE_ENABLED,Value=${DD_TRACE_ENABLED}" \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DD_RUNTIME_METRICS_ENABLED,Value=${DD_RUNTIME_METRICS_ENABLED}" \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DD_LOGS_INJECTION,Value=${DD_LOGS_INJECTION}" \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DD_LLMOBS_ENABLED,Value=${DD_LLMOBS_ENABLED}" \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DD_LLMOBS_AGENTLESS_ENABLED,Value=${DD_LLMOBS_AGENTLESS_ENABLED}" \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DD_LLMOBS_ML_APP,Value=${DD_LLMOBS_ML_APP}" \
              "Namespace=aws:elasticbeanstalk:cloudwatch:logs,OptionName=StreamLogs,Value=true" \
              "Namespace=aws:elasticbeanstalk:cloudwatch:logs,OptionName=DeleteOnTerminate,Value=false" \
              "Namespace=aws:elasticbeanstalk:cloudwatch:logs,OptionName=RetentionInDays,Value=7"

          for attempt in {1..180}; do
            environment_status="$(aws elasticbeanstalk describe-environments \
              --environment-names "${ENVIRONMENT_NAME}" \
              --query 'Environments[0].Status' \
              --output text)"

            if [[ "${environment_status}" == "Ready" ]]; then
              break
            fi

            if [[ "${environment_status}" == "Terminated" || "${environment_status}" == "Terminating" ]]; then
              echo "Environment entered an unexpected status: ${environment_status}" >&2
              exit 1
            fi

            if [[ "${attempt}" -eq 180 ]]; then
              echo "Timed out waiting for environment update: ${ENVIRONMENT_NAME}" >&2
              aws elasticbeanstalk describe-events \
                --environment-name "${ENVIRONMENT_NAME}" \
                --max-records 20 >&2
              exit 1
            fi

            sleep 10
          done

          health="$(aws elasticbeanstalk describe-environments \
            --environment-names "${ENVIRONMENT_NAME}" \
            --query 'Environments[0].Health' \
            --output text)"

          if [[ "${health}" != "Green" ]]; then
            echo "Deployment completed with unhealthy environment status: ${health}" >&2
            exit 1
          fi

          echo "Deployed ${version_label} to ${ENVIRONMENT_NAME}"
