name: Deploy Dev API

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Dev API
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ap-northeast-2
      APPLICATION_NAME: jobdori-dev
      ENVIRONMENT_NAME: jobdori-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: adopt
          cache: gradle

      - name: Build deployment bundle
        run: ./gradlew :jobdori-api:elasticBeanstalkBundle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy application version
        env:
          BUNDLE_PATH: jobdori-api/build/distributions/jobdori-api-elastic-beanstalk.zip
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          deployment_bucket="jobdori-dev-deployments-${account_id}"
          version_label="dev-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          object_key="applications/${version_label}.zip"

          aws s3 cp "${BUNDLE_PATH}" "s3://${deployment_bucket}/${object_key}"

          aws elasticbeanstalk create-application-version \
            --application-name "${APPLICATION_NAME}" \
            --version-label "${version_label}" \
            --source-bundle "S3Bucket=${deployment_bucket},S3Key=${object_key}" \
            --process

          aws elasticbeanstalk update-environment \
            --environment-name "${ENVIRONMENT_NAME}" \
            --version-label "${version_label}"

          aws elasticbeanstalk wait environment-updated \
            --environment-names "${ENVIRONMENT_NAME}"

          health="$(aws elasticbeanstalk describe-environments \
            --environment-names "${ENVIRONMENT_NAME}" \
            --query 'Environments[0].Health' \
            --output text)"

          if [[ "${health}" != "Green" ]]; then
            echo "Deployment completed with unhealthy environment status: ${health}" >&2
            exit 1
          fi

          echo "Deployed ${version_label} to ${ENVIRONMENT_NAME}"
