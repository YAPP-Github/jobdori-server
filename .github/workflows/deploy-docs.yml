name: "Deploy Docs to Github Pages"

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  asciidoctor:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: adopt
          cache: gradle

      - name: Build Asciidoctor file
        run: ./gradlew clean :untitled-api:asciidoctor

      - name: Deploy Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./untitled-api/build/docs/asciidoc
