axes:
  - name: 성과부풀리기없음
    tier: gate
    question: 원문에 없는 성과나 결과를 추가하거나 원문의 성과를 부풀렸는가.
    anchors:
      5: 모든 성과와 결과가 원문에서 확인되고 표현의 강도도 동일하다.
      3: 원문 성과에 근거하지만 일부 표현이 약간 과장되었다.
      1: 원문에 없는 성과를 만들거나 수치와 결과를 부풀린다.
  - name: S/T/A/R귀속정확성
    tier: core
    question: 원문의 정보가 Situation, Task, Action, Result에 올바르게 귀속되었는가.
    anchors:
      5: 각 정보가 올바른 STAR 단계에 배치되고 단계 간 서사가 연결된다.
      3: 핵심 흐름은 맞지만 일부 정보가 인접 단계에 배치된다.
      1: 단계가 뒤섞여 문제, 행동, 성과의 관계를 잘못 표현한다.
  - name: 정보보존율
    tier: core
    question: 원문에 있는 의미 있는 정보와 경험 항목을 얼마나 보존했는가.
    anchors:
      5: 원문의 경험과 세부 사실을 빠짐없이 보존하고 근거 없는 내용은 만들지 않는다.
      3: 핵심은 보존하지만 일부 세부 정보가 누락된다.
      1: 경험 항목이나 핵심 사실을 다수 생략한다.
  - name: R의실체성
    tier: diag
    question: Result가 원문에 근거한 실제 성과일 때만 채워졌는가.
    anchors:
      5: 원문에 성과가 있을 때만 구체적으로 쓰고 없으면 빈 문자열이다.
      3: 성과 근거는 있으나 결과와 행동이 일부 섞인다.
      1: 근거 없는 성과를 Result에 추가하거나 행동을 성과처럼 쓴다.
  - name: 빈칸정직성
    tier: diag
    question: 근거가 없는 STAR 필드를 억지로 채우지 않고 빈 값으로 두었는가.
    anchors:
      5: 근거가 없는 필드는 빈 문자열로 두고 근거 있는 필드만 작성한다.
      3: 대부분 정직하지만 일부 필드에 약한 추론을 덧붙인다.
      1: 모든 필드를 채우기 위해 원문에 없는 상황이나 목표를 만든다.
