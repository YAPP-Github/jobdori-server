axes:
  - name: 판정정확도
    scoring: precision
    scoring_note: >-
      골든셋에 __metadata:expected_matches가 있으면 이 앵커 대신 오병합 유무로 채점한다.
      모델이 중복이라 판정한 건이 전부 정답과 같은 프로젝트면 5, 하나라도 다르면 1이다.
      3점은 나오지 않는다. 설계서 03장대로 오병합 1건도 되돌릴 수 없는 데이터 손실이라 이분법으로 둔다.
      컬럼이 비어 있으면 아래 앵커로 judge가 채점한다.
    tier: gate
    question: 실제로 같은 프로젝트인 경우만 매칭하고 다른 프로젝트를 분리했는가.
    anchors:
      5: 모든 매칭과 비매칭 판정이 두 프로젝트의 구체적 근거와 일치한다.
      3: 대부분 정확하지만 일부 유사한 프로젝트의 판정 근거가 약하다.
      1: 다른 프로젝트를 매칭하거나 같은 프로젝트를 반복해서 비매칭 처리한다.
  - name: 데이터파괴없음
    tier: gate
    question: 병합 결과가 두 프로젝트의 사실과 수치를 빠짐없이 보존하는가.
    anchors:
      5: 양쪽에만 있는 정보와 수치를 모두 보존하고 중복만 합친다.
      3: 핵심 정보는 보존하지만 일부 세부 정보가 누락된다.
      1: 사실이나 수치를 삭제하거나 원문에 없는 내용을 덧붙인다.
  - name: 병합필드선택
    tier: core
    question: 매칭된 프로젝트의 summary, role, period를 두 원문의 근거에 맞게 선택했는가.
    anchors:
      5: 각 병합 필드가 더 구체적인 근거를 선택하고 기간은 양쪽 사실을 정확히 통합한다.
      3: 필드 대부분은 맞지만 일부 표현이나 기간 선택이 덜 구체적이다.
      1: 필드가 다른 프로젝트의 내용이 되거나 기간과 역할을 임의로 만든다.
  - name: 경계케이스판단
    tier: diag
    question: 이름이 다르거나 정보가 부족한 유사 프로젝트를 보수적으로 처리했는가.
    anchors:
      5: 확신이 부족한 유사 사례는 매칭하지 않고 구체적 공통 근거가 있을 때만 매칭한다.
      3: 대체로 보수적이지만 일부 유사 사례를 근거 부족 상태에서 매칭한다.
      1: 이름 유사성만으로 매칭하거나 별도 시기 프로젝트를 억지로 합친다.
