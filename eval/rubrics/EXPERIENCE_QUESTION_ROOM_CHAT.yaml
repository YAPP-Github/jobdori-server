axes:
  - name: 행동성과창작없음
    tier: gate
    question: 선택한 경험과 보충된 정보에 없는 행동, 결과, 기여를 쓰거나 원문 동사의 범위를 넓혔는가. 수치가 없어도 입력에 없는 행동이나 성과 서술이면 창작이다.
    anchors:
      5: 블록의 모든 행동과 결과가 선택한 경험과 보충된 정보에서 확인되고, 동사가 원문 범위 안에 있다.
      3: 새로운 행동이나 성과는 없지만 원문 동사를 한 단계 넓혔다(예를 들어 "설계"를 "설계하고 운영"으로).
      1: '입력에 없는 행동, 결과, 기여(예: "문제점을 도출함", "전략 수립에 기여함")가 등장하거나, 사용자가 모른다고 답한 정보를 썼다.'
  - name: 질문적합도
    tier: core
    question: 블록이 질문 카드가 묻는 행동에 가장 큰 비중을 두고, 상황은 별도 bullet 없이 행동 문장 안에 녹였는가.
    anchors:
      5: 질문 카드가 묻는 행동이 블록의 중심이고, 상황 설명은 행동 문장 안에 짧게 들어가 있다.
      3: 관련 경험이지만 질문 카드가 묻는 행동보다 다른 행동이나 상황 설명에 비중이 더 크다.
      1: 질문 카드와 무관한 경험이거나, STAR 순서대로 상황 bullet부터 기계적으로 나열했다.
  - name: 요청반영도
    tier: core
    question: 이번 사용자 입력(요청, 답변, 수정 지시)이 블록에 반영됐고, 현재 블록의 좋은 문장은 유지했는가.
    anchors:
      5: 이번 입력이 반영됐고, 새 정보와 관련 없는 현재 블록 문장은 그대로 남았다. 첫 생성이면 선택한 경험을 빠짐없이 활용했다.
      3: 이번 입력의 일부만 반영됐거나, 새 정보와 무관한 문장까지 다시 썼다.
      1: 이번 입력을 무시했거나 현재 블록을 통째로 다시 썼다.
  - name: 표현품질
    tier: core
    question: 판단이 드러나는 구체적 동사를 쓰고, 군더더기와 새 정보 없는 채우기 문장 없이 이력서에 바로 쓸 수 있는가.
    anchors:
      5: '동사가 무엇을 판단하고 바꿨는지 드러내고, "결과적으로", "이를 바탕으로" 같은 군더더기와 개수를 채우는 문장이 없다.'
      3: 내용은 구체적이지만 범용 동사나 군더더기가 한두 군데 남아 손을 봐야 쓸 수 있다.
      1: 상투구와 범용 동사가 문장의 중심이라 무엇을 했는지 흐릿하거나, 같은 내용을 반복해 bullet 수를 채웠다.
  - name: 제목품질
    tier: core
    question: 제목이 "무엇을 해서 어떤 결과"를 한 줄로 담고, 입력에 가장 강한 수치가 있으면 그것을 올렸는가.
    anchors:
      5: 행동과 결과가 한 줄에 드러나고, 가장 강한 수치(비율이면 상대 증감률 우선)가 들어갔다.
      3: 행동과 결과 중 하나만 드러나거나, 더 강한 수치를 두고 약한 수치를 올렸다.
      1: 수치만 있는 라벨형이거나 "~경험"처럼 무엇을 했는지 알 수 없는 제목이다.
  - name: 다음질문유용성
    tier: core
    question: question이 블록을 가장 크게 끌어올릴 정보 하나를 우선순위(발견, 판단, 실행, 규모와 맥락, 역할)대로 한 줄로 답할 수 있게 묻는가.
    anchors:
      5: 블록에 아직 없는 가장 앞 순위 항목 하나를 묻고, 괄호 속 답변 예시가 있어 한 줄로 답할 수 있다.
      3: 유용한 정보를 묻지만 순위를 건너뛰었거나, 예시가 없거나, 두 가지를 한 번에 묻는다.
      1: '"더 자세히 알려주세요"처럼 막연하거나, 이미 블록에 있거나 사용자가 모른다고 답한 내용을 다시 묻는다.'
  - name: 피드백정확성
    tier: diag
    question: fit이 블록과 연결되는 JD 항목을 짚고, changed가 이번 턴에 실제로 달라진 부분을 맞게 설명하는가.
    anchors:
      5: fit이 연결되는 업무 내용이나 우대 경험을 구체적으로 짚고, changed가 실제 바뀐 부분과 일치한다.
      3: 역할은 맞지만 "잘 연결됩니다"처럼 일반적이거나, changed가 바뀐 부분 일부만 말한다.
      1: changed가 실제로 바뀌지 않은 내용을 말하거나, fit이 JD와 무관하다.
  - name: 종료판정
    tier: diag
    question: 발견, 판단, 실행이 모두 채워졌을 때만 complete로 판정했는가.
    anchors:
      5: 발견, 판단, 실행이 모두 블록에 있을 때만 complete이고, 하나라도 비면 in_progress다.
      3: 남은 항목이 블록을 크게 바꾸는데도 complete로 판정했다.
      1: 발견, 판단, 실행 중 빠진 것이 있는데 complete이거나, 모두 채워졌는데 사소한 것을 계속 묻는다.
  - name: JD키워드자연스러움
    tier: diag
    question: 경험이 실제로 뒷받침하는 JD 키워드만 문장에 자연스럽게 녹였는가.
    anchors:
      5: JD 키워드가 경험의 사실과 맞물려 자연스럽게 들어갔다.
      3: 키워드는 맞지만 문장에 억지로 끼워 넣은 티가 난다.
      1: 경험이 뒷받침하지 않는 JD 키워드를 끼워 넣었거나 JD 키워드가 전혀 없다.
