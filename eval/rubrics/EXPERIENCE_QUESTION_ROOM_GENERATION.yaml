axes:
  - name: 출처정확성
    tier: gate
    question: 각 카드의 sourceType과 index가 그 질문이 실제로 근거한 입력 항목을 가리키는가. sourceText는 index가 가리키는 입력 원문이고, 입력에 없는 번호면 null이다.
    anchors:
      5: 모든 카드의 sourceType과 index가 질문 내용과 일치하는 항목을 가리킨다.
      3: 질문이 두 항목에 걸쳐 있어 가리킨 항목과 부분적으로만 일치하는 카드가 있다.
      1: 질문 내용과 다른 항목을 가리키거나 sourceText가 null인(입력에 없는 번호를 가리키는) 카드가 있다.
  - name: 질문구체성
    tier: core
    question: JD 문구를 옮겨 적지 않고, 그 항목을 수행할 때 실제로 하는 구체적인 행동 하나를 묻는가.
    anchors:
      5: 모든 질문이 항목 수행에 필요한 구체적 행동 하나를 묻고, 지원자가 예/아니오와 사례로 답할 수 있다.
      3: 일부 질문이 JD 문구에 "직접"만 붙이거나 "~한 경험"으로만 바꿔 행동이 막연하다.
      1: 대부분의 질문이 JD 문구를 그대로 옮겼거나 한 질문에 행동 여러 개를 묶었다.
  - name: 항목선정
    tier: core
    question: 담당업무를 우선해 합격에 중요한 항목을 골랐고, 서로 같은 경험을 묻는 질문이 없는가.
    anchors:
      5: 담당업무의 핵심 항목을 먼저 다루고, 우대사항은 담당업무로 다루지 못한 경험만 묻는다. 중복 질문이 없다.
      3: 핵심 항목 일부가 빠졌거나 우대사항을 담당업무보다 앞세웠다.
      1: 사실상 같은 경험을 묻는 질문이 두 개 이상이거나 핵심 담당업무를 대부분 놓쳤다.
