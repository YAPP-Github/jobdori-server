axes:
  - name: 순위타당성
    scoring: kendall_tau
    scoring_note: >-
      골든셋에 __metadata:expected_ranking이 있으면 이 앵커 대신 Kendall tau-b로 채점한다.
      0.8 이상 5, 0.6 이상 4, 0.4 이상 3, 0.2 이상 2, 그 미만 1.
      모델이 전 항목에 같은 matchRate를 주면 tau-b가 0이 되어 1점이다.
      컬럼이 비어 있으면 아래 앵커로 judge가 채점한다.
    tier: core
    question: 추천 순위가 JD 요구와 경험의 근거를 비교한 결과와 일치하는가.
    anchors:
      5: 상위 경험일수록 JD와의 직접 근거가 강하고 순위가 일관된다.
      3: 일부 순위는 타당하지만 비슷한 경험 사이의 순서 근거가 약하다.
      1: JD와 무관한 경험이 상위에 오르거나 순위가 근거 없이 정해진다.
  - name: reason근거성
    tier: core
    question: 각 추천 이유가 입력된 JD와 경험의 구체적 내용에 근거하는가.
    anchors:
      5: 모든 이유가 JD 요구와 경험의 구체적 구절을 연결한다.
      3: 이유가 방향은 맞지만 구체적 근거가 일부 부족하다.
      1: 이유가 입력과 무관한 일반론이거나 근거를 지어낸다.
  - name: 점수분포건전성
    tier: core
    question: 경험 간 차이를 반영하도록 점수가 구분되어 있는가.
    anchors:
      5: 직접 근거의 강약에 따라 점수가 구분되고 동일 점수 남발이 없다.
      3: 대체로 차이를 반영하지만 일부 점수가 뭉친다.
      1: 대부분의 경험에 같은 점수를 주거나 순위와 점수가 모순된다.
  - name: 상위이유차별성
    tier: diag
    question: 상위 추천 경험의 이유가 다른 경험의 이유와 구별되는가.
    anchors:
      5: 상위 경험마다 서로 다른 구체적 접점을 이유로 제시한다.
      3: 일부 이유가 구별되지만 비슷한 표현이 반복된다.
      1: 모든 이유가 같은 상투적 문장으로 반복된다.
