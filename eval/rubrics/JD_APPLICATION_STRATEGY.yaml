axes:
  - name: 갭정직성
    tier: gate
    question: 지원자에게 없는 JD 요구 경험을 있는 것처럼 제안하지 않았는가.
    anchors:
      5: 갭을 정확히 인정하고 입력에 있는 접점만 근거로 전략을 제안한다.
      3: 갭은 인정하지만 일부 표현이 실제 경험보다 넓게 해석된다.
      1: 없는 기술, 경험, 성과를 있다고 전제하거나 숨기라고 조언한다.
  - name: 실행가능성
    tier: core
    question: JD의 핵심 요구를 식별했는가 -> 그 요구에 대응하는 유저 경험을 실제로 찾아 연결했는가 -> 무엇을 어떻게 할지 구체적으로 명시했는가. 3단계를 모두 충족해야 5점.
    anchors:
      5: '세 단계 모두 충족. "JD가 트랜잭션 처리량을 강조하니, 결제 정산 경험을 이력서 첫 항목에 올리고 수치를 적을 것"처럼 요구->근거->행동이 한 문장에서 연결된다.'
      3: '요구는 맞게 짚었는데 근거경험 연결 없이 방향만 준다. "결제 도메인 경험을 강조하세요."'
      1: '요구 식별 자체가 틀렸거나 태도 조언에 그친다. "자신감을 가지고 임하세요."'
  - name: JD특정성
    tier: diag
    question: 전략이 해당 JD의 요구와 입력 경험의 조합에 특화되어 있는가.
    anchors:
      5: JD의 구체적 요구와 지원자 경험의 접점을 다른 JD에 그대로 쓰기 어렵게 설명한다.
      3: JD와 경험을 언급하지만 일반적인 지원 조언으로도 읽힌다.
      1: JD나 경험의 구체 내용 없이 모든 지원자에게 적용되는 문장만 쓴다.
