axes:
  - name: 필드귀속정확성
    tier: core
    question: 추출한 값이 원문의 올바른 필드에 배치되었는가.
    anchors:
      5: 모든 값이 원문의 의미와 필드에 정확히 귀속된다.
      3: 대부분의 값은 맞지만 일부가 인접 필드에 섞인다.
      1: 핵심 값이 다른 필드에 배치되거나 원문과 반대로 귀속된다.
  - name: 원문충실성
    tier: core
    question: 원문에 있는 사실을 보존하고 없는 사실을 추가하지 않았는가.
    anchors:
      5: 원문의 사실을 빠짐없이 보존하며 추가나 의미 왜곡이 없다.
      3: 사실은 대체로 보존하지만 일부 요약으로 정보가 약해진다.
      1: 핵심 사실을 누락하거나 원문과 다른 의미로 바꾼다.
  - name: 커버리지
    tier: diag
    question: 요구된 추출 항목을 얼마나 빠짐없이 채웠는가.
    anchors:
      5: 원문에 근거가 있는 모든 요구 항목을 빠짐없이 채운다.
      3: 일부 항목이 비어 있지만 핵심 항목 대부분은 채운다.
      1: 근거가 있는 핵심 항목 다수를 누락한다.
  - name: 항목분해품질
    tier: diag
    question: 배열 항목이 서로 구분되는 의미 단위로 분해되었는가.
    anchors:
      5: 각 배열 항목이 하나의 의미 단위이며 항목 간 중복이 없다.
      3: 분해는 되었지만 일부 항목이 합쳐지거나 중복된다.
      1: 여러 요구 항목을 한 항목에 몰아넣거나 분해 기준이 무너진다.
