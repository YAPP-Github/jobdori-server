axes:
  - name: 과분할/과병합
    tier: core
    question: 서로 다른 공고를 분리하고 같은 공고의 줄은 하나의 범위로 묶었는가.
    anchors:
      5: 모든 공고가 정확히 하나의 범위로 분리되고 공고 밖 줄이 포함되지 않는다.
      3: 공고 수는 맞지만 일부 범위가 인접 공고 또는 공고 밖 줄과 겹친다.
      1: 공고를 빠뜨리거나 하나의 공고를 여러 범위로 나누거나 여러 공고를 합친다.
  - name: 분할경계정확성
    tier: diag
    question: 각 범위의 시작 줄과 끝 줄이 공고 본문 경계를 정확히 가리키는가.
    anchors:
      5: 모든 시작 줄과 끝 줄이 해당 공고의 첫 줄과 마지막 줄을 정확히 가리킨다.
      3: 경계가 한두 줄 어긋나지만 공고 식별에는 영향을 주지 않는다.
      1: 경계 오류로 공고 본문이 누락되거나 다른 내용을 포함한다.
  - name: title대표성
    tier: diag
    question: 각 공고의 title이 본문에서 확인되는 대표 제목을 나타내는가.
    anchors:
      5: 각 title이 본문 제목을 충실히 대표하고 제목이 없으면 빈 문자열이다.
      3: title이 본문에서 유추되지만 일부 표현이 지나치게 일반적이다.
      1: title이 본문과 무관하거나 본문에 없는 제목을 만든다.
