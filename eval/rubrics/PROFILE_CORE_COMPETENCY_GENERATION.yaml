axes:
  - name: 변별력
    tier: core
    question: 이 역량 표현이 다른 지원자 프로필에 붙여도 어색하지 않은가. 그리고 문장의 어투/강조점에서 이 사람의 업무 스타일이나 가치관이 읽히는가.
    anchors:
      5: 내용도 이 사람 경험에서만 나올 수 있고, 문장 톤에서도 개인의 일하는 방식(꼼꼼함, 속도감, 협업 지향 등)이 드러난다.
      3: 내용은 구체적이지만 문장 톤은 표준적인 서술형이라 누가 썼는지 구분이 안 간다.
      1: '"커뮤니케이션 능력", "책임감" 같은 무색무취 역량이거나, 톤도 정형화된 이력서 문구로 처리됐다.'
  - name: 근거추적성
    tier: diag
    question: 각 핵심역량을 입력된 경험의 구체적 사실로 추적할 수 있는가.
    anchors:
      5: 모든 역량 표현이 입력 경험의 행동이나 성과 구절과 직접 연결된다.
      3: 대부분 근거가 있지만 일부 표현은 경험에서 간접적으로만 추정된다.
      1: 역량의 근거를 입력에서 찾을 수 없다.
  - name: 중복없음
    tier: diag
    question: 생성된 핵심역량들이 서로 다른 능력이나 업무 특성을 구분하는가.
    anchors:
      5: 각 역량이 서로 다른 행동과 업무 특성을 나타내며 의미가 겹치지 않는다.
      3: 일부 역량이 유사한 의미를 반복한다.
      1: 같은 역량을 표현만 바꾸어 반복한다.
  - name: 직무정합성
    tier: diag
    question: 핵심역량이 입력된 지원 직무의 요구와 연결되는가.
    anchors:
      5: 직무 요구와 직접 연결되는 역량을 우선 제시하고 경험 근거도 맞는다.
      3: 역량은 경험에 근거하지만 직무 요구와의 연결이 약하다.
      1: 직무와 무관한 역량이나 입력에 없는 요구를 제시한다.
