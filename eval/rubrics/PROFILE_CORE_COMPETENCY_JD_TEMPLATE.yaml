axes:
  - name: 지원자단정없음
    tier: gate
    question: 지원자에게서만 나올 수 있는 내용(경험, 성과, 숙련도, 습관)을 자리표시자로 비우지 않고 완성된 문장으로 단정했는가.
    anchors:
      5: 지원자 개인에 관한 내용은 모두 자리표시자로 비어 있고, 완성된 문장 부분은 JD로 확정할 수 있는 직무 맥락뿐이다.
      3: 경험을 단정하지는 않지만 특정 성향이나 습관을 지원자의 것으로 전제한 표현이 한 군데 있다.
      1: '"운영 경험을 바탕으로", "능숙하게 다루는"처럼 지원자에게 경험이나 역량이 있다고 단정한다.'
  - name: 일하는방식전환
    tier: core
    question: JD 업무를 그대로 옮기지 않고 "그 업무를 잘하는 사람은 어떻게 생각하고 판단하는가"로 바꿔 썼는가.
    anchors:
      5: 모든 문장이 업무 나열이 아니라 판단 기준이나 일하는 태도를 말하고, JD 문구를 그대로 옮긴 곳이 없다.
      3: 일부 문장이 "시나리오 작성 시에는"처럼 JD 업무 항목을 그대로 옮긴 뒤 자리표시자만 붙였다.
      1: 대부분의 문장이 JD 업무 목록을 순서대로 옮겨 적은 것이다.
  - name: 자리표시자적합성
    tier: core
    question: 자리표시자가 명사구 자리에 있어 무엇을 채워도 문장이 자연스럽고, 두 예시가 서로 다른 방향을 보여주는가.
    anchors:
      5: 모든 자리표시자가 명사구 자리에 있고 조사까지 자연스럽게 이어지며, 예시 두 개가 서로 다른 접근을 보여준다.
      3: 문장은 이어지지만 예시 두 개가 비슷한 말이거나, 채울 내용이 모호해 무엇을 써야 할지 망설여진다.
      1: 자리표시자 뒤에서 문장이 끊기거나 조사가 맞지 않아, 채워도 문장이 성립하지 않는다.
  - name: 축다양성
    tier: core
    question: 헤드라인은 문제를 찾고 푸는 방식을 다루고, 나머지 문장은 서로 다른 JD 축(업무, 우대 사항, 인재상, 도메인 특성)을 다루는가.
    anchors:
      5: 헤드라인이 문제 해결 방식을 다루고, 나머지 문장이 각기 다른 축을 다뤄 같은 JD 항목이 두 번 나오지 않는다.
      3: 축이 대체로 다르지만 두 문장이 사실상 같은 업무를 다룬다.
      1: 대부분의 문장이 같은 업무나 같은 축을 반복한다.
  - name: 문체자연스러움
    tier: diag
    question: 실제 지원자가 쓸 법한 문체로, 종결 표현이 문장마다 다르고 홍보문이나 AI 자기소개서 같은 표현이 없는가.
    anchors:
      5: 문장마다 다른 종결 표현을 쓰고, 과장이나 홍보 문구 없이 담백하다.
      3: 같은 종결 표현이 두 번 이상 나오거나 "효율성을 높이는" 같은 상투구가 섞였다.
      1: 홍보문처럼 과장됐거나 모든 문장이 같은 틀로 반복된다.
