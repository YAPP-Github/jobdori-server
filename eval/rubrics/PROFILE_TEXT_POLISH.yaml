axes:
  - name: 의미보존
    tier: gate
    question: 첨삭 전 원문의 사실, 수치, 고유명사, 의도가 그대로 보존되었는가.
    anchors:
      5: 원문의 사실, 수치, 고유명사, 의도를 모두 그대로 보존한다.
      3: 핵심 의미는 보존하지만 일부 뉘앙스나 세부 표현이 약해진다.
      1: 사실, 수치, 고유명사, 의도 중 하나라도 바꾸거나 삭제한다.
  - name: 개선실재성
    scoring: pairwise
    scoring_note: >-
      골든셋에 __metadata:original이 있으면 이 앵커 대신 순서를 뒤집은 두 번의 비교로 채점한다.
      두 번 다 첨삭본을 고르면 5, 판정이 뒤집히면 위치 편향으로 보고 3, 두 번 다 원문을 고르면 1이다.
      여기서 3점은 출력 품질이 아니라 판정을 신뢰할 수 없다는 뜻이다.
      컬럼이 비어 있으면 아래 앵커로 judge가 채점한다.
    tier: core
    question: 출력이 원문보다 읽기 쉽고 명확해진 구체적 개선을 보여주는가.
    anchors:
      5: 문장 구조나 표현이 실제로 개선되어 핵심 내용과 흐름이 더 명확하다.
      3: 일부 표현은 매끄러워졌지만 명확성 개선이 제한적이다.
      1: 원문과 차이가 없거나 수정으로 가독성이 나빠진다.
  - name: 요청사항반영도
    tier: core
    question: 유저가 명시한 요청(구조 변경, 톤 조정, 특정 문구 추가/삭제 등)이 출력에 실제로 반영됐는가.
    scoring_note: >-
      구조 지정형 요청(예: "불렛으로 바꿔줘")은 요청 내용이 케이스마다 달라 전역 룰이 성립하지 않는다.
      그런 케이스는 골든셋의 __expected에 검사를 직접 적는다(예: contains: -).
      __expected는 이 축 점수와 별개로 케이스 전체의 pass/fail에 반영된다.
    anchors:
      5: 요청한 항목 전부가 반영됐고, 요청하지 않은 부분은 임의로 안 건드렸다.
      3: 요청의 일부만 반영됐거나, 요청 이상으로 다른 부분까지 손댔다.
      1: 요청을 무시하고 이전과 같은 방식으로 첨삭했다.
  - name: 과첨삭
    tier: diag
    question: 요청 범위를 넘어 원문의 표현과 구조를 불필요하게 바꾸었는가.
    anchors:
      5: 요청한 부분만 수정하고 나머지 문장과 구조는 유지한다.
      3: 일부 요청 밖 표현까지 바꾸지만 의미와 목적은 유지한다.
      1: 요청과 무관하게 전체 내용을 다시 쓰거나 구조를 바꾼다.
  - name: 톤일관성
    tier: diag
    question: 출력 전체가 요청된 말투와 문체를 일관되게 유지하는가.
    anchors:
      5: 모든 문장이 요청된 톤과 종결 방식으로 일관된다.
      3: 대체로 일관되지만 일부 문장에서 톤이 흔들린다.
      1: 문장마다 톤이 달라 요청된 문체를 알아보기 어렵다.
  - name: 최소개입
    tier: diag
    question: 의미를 보존하면서 필요한 만큼만 수정했는가.
    anchors:
      5: 문제 있는 표현만 최소한으로 고쳐 원문 구조와 정보량을 유지한다.
      3: 개선에 필요한 범위를 약간 넘어 수정한다.
      1: 작은 요청에도 원문을 전면 재작성한다.
