axes:
  - name: 의미보존
    tier: gate
    question: rewrite 전 원문의 사실, 수치, 고유명사, 경험 의미가 그대로 보존되었는가.
    anchors:
      5: 원문의 사실, 수치, 고유명사, 경험 의미를 모두 그대로 보존한다.
      3: 핵심 의미는 보존하지만 일부 세부 표현이나 뉘앙스가 약해진다.
      1: 사실, 수치, 고유명사, 경험 의미 중 하나라도 바꾸거나 삭제한다.
  - name: 정량화창작없음
    tier: gate
    question: 원문에 없는 정량 성과나 수치를 출력에 추가했는가.
    anchors:
      5: 출력의 모든 수치와 정량 성과가 원문에서 확인된다.
      3: 원문 수치를 사용하지만 일부 표현이 수치의 범위를 넓힌다.
      1: 원문에 없는 수치나 정량 성과를 창작한다.
  - name: title축
    tier: core
    question: JD가 요구하는 경험/역량이 드러나면서 간결한가.
    anchors:
      5: JD 핵심 요구와 직결된 경험이 명사구로 간결하게 드러난다.
      3: 경험은 맞게 골랐지만 표현이 늘어지거나 JD와의 연결이 약하다.
      1: JD와 무관하거나, title만 봐서는 무슨 경험인지 알 수 없다.
  - name: 본문축
    tier: core
    question: >-
      title을 상세 설명하는 구조로, 실제 수행 업무와 성과가 일목요연하게 드러나는가.
      프롬프트가 허용하는 세 구조(Action + Result 나열식, 문제 - 원인 - 해결 - 성과, 담당 업무 나열식) 중
      하나를 모든 경험에 일관되게 적용했는지 함께 본다.
    anchors:
      5: 세 구조 중 하나를 모든 경험에 일관되게 적용했고, JD 연관 업무, 실제 행동, 성과가 순서대로 명확히 읽힌다. 나열형이면 "-"로 항목이 구분된다.
      3: 내용은 맞지만 두괄식이 아니거나 성과가 흐릿하게 표현됐다.
      1: 한 문단으로 뭉뚱그렸거나 경험마다 구조가 뒤섞였다. 또는 title과 본문 내용이 따로 논다.
  - name: 동사다양성
    tier: diag
    question: 본문이 같은 동사의 반복을 피하고 수행 행동을 구체적인 동사로 표현하는가.
    anchors:
      5: 행동별로 구체적이고 서로 다른 동사를 사용해 수행 내용을 구분한다.
      3: 일부 동사가 반복되지만 행동의 차이는 대체로 드러난다.
      1: 같은 동사와 추상적 표현을 반복해 수행 행동을 구분하기 어렵다.
