mutation CreateExperience {
    createExperience(
        workspaceId: "00000000-0000-0000-0000-000000000002"
        request: {
            projectId: 1
            tags: ["GraphQL", "Kotlin", "API"]
            title: "이력서 생성 API 구현"
            contents: {
                type: STAR
                star: {
                    situation: "이력서 섹션과 아이템을 자유롭게 구성해야 하는 요구사항이 있었습니다."
                    task: "클라이언트가 한 번의 요청으로 전체 이력서 스냅샷을 저장할 수 있는 API가 필요했습니다."
                    action: "SaveResumeInput을 기준으로 섹션 타입과 payload를 검증하고, core 서비스에서 저장 흐름을 일관되게 처리했습니다."
                    result: "생성, 수정 API의 입력 구조를 통일해 프론트엔드 연동 비용을 줄이고 테스트 커버리지를 확보했습니다."
                }
            }
        }
    ) {
        experienceId
        tags
        title
        project {
            projectId
            name
        }
        contents {
            type
            star {
                situation
                task
                action
                result
            }
            free {
                content
            }
        }
    }
}
