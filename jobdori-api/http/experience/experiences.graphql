query Experiences {
    experiences(
        workspaceId: "00000000-0000-0000-0000-000000000002"
        projectId: 1
        jdId: "00000000-0000-0000-0000-000000000003"
        questionRoomId: "00000000-0000-0000-0000-000000000004"
        tab: AI_RECOMMENDATION
        cursor: null
        size: 10
    ) {
        experiences {
            experienceId
            tags
            title
            matchRate
            recommendedReason
            project {
                projectId
                name
            }
            contents {
                type
                star {
                    situation
                    task
                    action
                    result
                }
                free {
                    content
                }
            }
        }
        cursor {
            nextCursor
            hasNext
        }
    }
}
