query NotionPages {
    notionPages(
        workspaceId: "00000000-0000-0000-0000-000000000002"
        connectionId: "00000000-0000-0000-0000-000000000601"
        query: "이력서"
        cursor: null
        size: 10
    ) {
        pages {
            pageId
            title
            url
            lastEditedTime
        }
        cursor {
            nextCursor
            hasNext
        }
    }
}
