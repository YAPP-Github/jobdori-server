query Resumes {
    resumes(
        workspaceId: "00000000-0000-0000-0000-000000000002"
        statuses: [COMPLETED, DRAFT]
    ) {
        resumeId
        targetJd {
            jdId
            sourceUrl
            companyName
            positionTitle
            status
        }
        template
        status
        createdAt
        updatedAt
    }
}
