mutation ApplyExperienceQuestionRoomBlock {
    applyExperienceQuestionRoomBlock(
        workspaceId: "00000000-0000-0000-0000-000000000002"
        questionRoomId: "00000000-0000-0000-0000-0000000000b1"
        messageId: "1"
        resumeId: "1"
    ) {
        itemId
        displayOrder
        visible
        payload {
            experience {
                name
                role
                contents
            }
        }
        createdAt
    }
}
