query JdRecommendations {
    jdRecommendations(
        tags: [POPULAR]
        cursor: null
        size: 10
    ) {
        recommendations {
            id
            tags
            companyName
            title
            recruitmentStartAt
            recruitmentEndAt
            sourceUrl
        }
        cursor {
            nextCursor
            hasNext
        }
    }
}
