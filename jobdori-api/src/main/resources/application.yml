spring.profiles.default: local
spring.config:
  import:
    - classpath:/rdb.yml
    - classpath:/client.yml
    - classpath:core.yml

server:
  port: ${SERVER_PORT:20000}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mvc:
    servlet:
      path: /api
  graphql:
    http:
      path: /graphql
    graphiql:
      enabled: true
      path: /graphiql

sentry:
  enabled: true
  dsn: ${SENTRY_DSN:}
  logging:
    enabled: true
    minimum-event-level: warn

---
spring:
  config:
    activate:
      on-profile:
        - local
        - test

sentry:
  enabled: false
  logging:
    enabled: false

