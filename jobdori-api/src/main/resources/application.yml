spring.profiles.default: local
spring.config:
  import:
    - classpath:/rdb.yml
    - classpath:/client.yml
    - classpath:core.yml

server:
  port: ${SERVER_PORT:20000}
  tomcat:
    # tomcat.threads.* 메트릭은 MBean 레지스트리가 꺼져 있으면(기본값) 등록되지 않는다
    mbeanregistry:
      enabled: true
    # basedir 미지정 시 액세스 로그가 임시 디렉토리에 쓰여 유실된다. ./logs/access_log.*.log로 남긴다.
    basedir: .
    accesslog:
      enabled: true
      pattern: "%t %r %s %b %Dus"   # %D(처리시간)와 ai_call latencyMs의 간격으로 AI 외 병목을 본다. Tomcat 10+의 %D는 마이크로초

spring:
  application:
    name: jobdori-api
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    servlet:
      path: /api
  graphql:
    http:
      path: /graphql
    graphiql:
      enabled: false
      path: /graphiql

# 스레드풀 고갈 등 런타임 상태 확인용. 외부에 노출되지 않도록 서비스 포트와 분리한다(LB에는 서비스 포트만 연결).
management:
  server:
    port: ${MANAGEMENT_PORT:20001}
  endpoints:
    web:
      exposure:
        include: health,metrics

sentry:
  enabled: true
  dsn: ${SENTRY_DSN:}
  logging:
    enabled: true
    minimum-event-level: warn

---
spring:
  config:
    activate:
      on-profile:
        - local
        - test

sentry:
  enabled: false
  logging:
    enabled: false
server:
  tomcat:
    accesslog:
      enabled: false   # 로컬/테스트에서 ./logs 디렉토리 생성 방지

logging:
  level:
    com.jobdori: DEBUG

---
spring:
  config:
    activate:
      on-profile:
        - local
        - dev
  web:
    resources:
      add-mappings: true
  graphql:
    graphiql:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  structured:
    format:
      console: com.jobdori.api.support.logging.DatadogStructuredLogFormatter
