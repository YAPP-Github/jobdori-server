<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프롬프트 테스트 · Jobdori</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 820px; margin: 0 auto; padding: 24px; line-height: 1.5; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    .hint { color: #888; font-size: .85rem; margin: 0 0 20px; }
    label { display: block; font-weight: 600; font-size: .85rem; margin: 14px 0 4px; }
    select, textarea, input[type=file] { width: 100%; padding: 8px; font: inherit; border: 1px solid #999; border-radius: 6px; background: transparent; color: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 180px; }
    button { margin-top: 18px; padding: 10px 20px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; background: #2d6cdf; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .meta { font-size: .8rem; color: #888; margin: 16px 0 6px; }
    pre { background: #00000010; padding: 14px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin: 0; }
    .err { color: #d33; }
    .ok { color: #2a2; }
  </style>
</head>
<body>
  <h1>프롬프트 테스트 API</h1>
  <p class="hint">DB의 프롬프트를 골라 실제 OpenAI 호출 결과를 확인합니다. (POST /api/test-prompts · local/dev/test 전용)</p>

  <label>프롬프트 타입</label>
  <select id="promptType">
    <option value="JD_MULTI_POSTING_SPLIT">JD_MULTI_POSTING_SPLIT (다중 공고 분할 · structured)</option>
    <option value="JD_META_EXTRACTION" selected>JD_META_EXTRACTION (기업·직무·정제본문·태그 · structured)</option>
    <option value="JD_KEY_POINTS">JD_KEY_POINTS (공고 핵심 요약 · text)</option>
    <option value="JD_APPLICATION_STRATEGY">JD_APPLICATION_STRATEGY (지원 전략 생성 · text)</option>
    <option value="EXPERIENCE_RECOMMENDATION">EXPERIENCE_RECOMMENDATION (JD-경험 매칭 · structured)</option>
    <option value="EXPERIENCE_STAR_EXTRACTION">EXPERIENCE_STAR_EXTRACTION (경험 STAR · structured)</option>
    <option value="RESUME_EXPERIENCE_REWRITE">RESUME_EXPERIENCE_REWRITE (이력서 문장 일괄 생성 · structured)</option>
    <option value="EXPERIENCE_CONTENTS_POLISH">EXPERIENCE_CONTENTS_POLISH (자유 경험 → STAR · structured)</option>
    <option value="PROFILE_CORE_COMPETENCY_GENERATION">PROFILE_CORE_COMPETENCY_GENERATION (핵심역량 생성 · text)</option>
    <option value="PROFILE_TEXT_POLISH">PROFILE_TEXT_POLISH (프로필 텍스트 다듬기 · text)</option>
  </select>

  <label>userPrompt (입력 텍스트)</label>
  <textarea id="userPrompt" placeholder="JD 본문, 경험 원문 등 입력...">네이버 백엔드 개발자 채용. 자격요건: Kotlin/Java 3년, Spring. 우대: Kafka, AWS.</textarea>

  <div class="row">
    <div>
      <label>PDF 첨부 (선택 · 텍스트 추출)</label>
      <input type="file" id="files" accept="application/pdf" multiple>
    </div>
    <div>
      <label>structured 오버라이드 (선택)</label>
      <select id="structured">
        <option value="">자동 (jsonSchema 유무)</option>
        <option value="true">true</option>
        <option value="false">false</option>
      </select>
    </div>
  </div>

  <button id="send">호출</button>

  <div class="meta" id="meta"></div>
  <pre id="out">결과가 여기에 표시됩니다.</pre>

  <script>
    const $ = id => document.getElementById(id);

    // 실서비스에서 코드가 userPrompt를 조립하는 타입은 그 형식을 placeholder로 안내
    // (GenerateExperienceRecommendationService, ProfileAiService 참고)
    const PLACEHOLDERS = {
      EXPERIENCE_RECOMMENDATION:
        '## JD\n네이버 백엔드 개발자 채용. 자격요건: Kotlin/Java 3년, Spring.\n\n' +
        '## 지원 전략\nJD는 Kotlin/Spring 실무 경험을 원해요. 그러니까 주문 시스템 개선처럼 실무 성과가 드러나는 경험을 강조해서 지원하는 게 좋겠어요.\n\n' +
        '## 경험 목록\n[1] 주문 시스템 개선\n태그: Kotlin, MSA\n상황: ...\n과제: ...\n행동: ...\n결과: ...\n\n[2] ...',
      PROFILE_CORE_COMPETENCY_GENERATION:
        '[JD]\n네이버 백엔드 개발자 채용. 주요 업무: 주문/결제 시스템 개발. 자격요건: Kotlin/Java 3년, Spring. 우대: Kafka, AWS.\n' +
        '[지원 전략]\nJD는 Kotlin/Spring 실무 경험을 원해요. 실무 성과가 드러나는 경험을 강조해서 지원하는 게 좋겠어요.\n' +
        '[경력]\n- 회사명 / 백엔드 개발 (2022-01 - 2024-05): 주문 시스템 개발\n[스킬]\nKotlin, Spring, MySQL',
      PROFILE_TEXT_POLISH:
        '[항목] 핵심역량\n[글자수 제한] 500자\n[원문]\n다듬을 텍스트...',
    };
    const DEFAULT_PLACEHOLDER = 'JD 본문, 경험 원문 등 입력...';
    const INITIAL_SAMPLE = $('userPrompt').value;
    $('promptType').addEventListener('change', () => {
      const ph = PLACEHOLDERS[$('promptType').value];
      $('userPrompt').placeholder = ph || DEFAULT_PLACEHOLDER;
      // 형식이 특수한 타입: 손대지 않은 기본 JD 샘플이 그대로 전송되지 않게 비워서 형식 안내를 노출
      if (ph && $('userPrompt').value === INITIAL_SAMPLE) $('userPrompt').value = '';
    });

    $('send').addEventListener('click', async () => {
      const btn = $('send'), out = $('out'), meta = $('meta');
      const fd = new FormData();
      fd.append('promptType', $('promptType').value);
      const up = $('userPrompt').value.trim();
      if (up) fd.append('userPrompt', up);
      for (const f of $('files').files) fd.append('files', f);
      if ($('structured').value) fd.append('structured', $('structured').value);

      btn.disabled = true; meta.textContent = '호출 중...'; out.textContent = '';
      const t0 = performance.now();
      try {
        // 같은 오리진(/api/prompt-test.html)에서 서빙되므로 상대경로로 호출
        const res = await fetch('test-prompts', { method: 'POST', body: fd });
        const json = await res.json();
        const ms = Math.round(performance.now() - t0);
        const r = json.result;
        if (json.ok && r) {
          meta.innerHTML = `<span class="ok">HTTP ${res.status}</span> · ${ms}ms · model=${r.model} · structured=${r.structured}`;
          const output = typeof r.output === 'string' ? r.output : JSON.stringify(r.output, null, 2);
          out.textContent = '[output]\n' + output + '\n\n[systemPrompt]\n' + r.systemPrompt;
        } else {
          meta.innerHTML = `<span class="err">HTTP ${res.status} · 실패</span> · ${ms}ms`;
          out.textContent = JSON.stringify(json, null, 2);
        }
      } catch (e) {
        meta.innerHTML = `<span class="err">요청 실패</span>`;
        out.textContent = String(e) + '\n\n서비스가 :20000 에 떠 있는지, 이 페이지를 http://localhost:20000/api/prompt-test.html 로 열었는지 확인하세요.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
